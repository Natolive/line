# Production (server): started by /srv/line/deploy.sh after each push to main.
# Caddy (separate stack, /srv/caddy) serves https://line.natolive.fr and http://<server IP>:8000 and reaches this container over the external
# `proxy` network as `line-game` (service names are shared between projects on that network, hence the alias).
# One container serves the built game and the multiplayer WebSocket (/ws) on port 3000.
# `.env` next to this file (not versioned): IMAGE_TAG, written by deploy.sh.
name: line

services:
  line:
    image: ghcr.io/natolive/line:${IMAGE_TAG:?IMAGE_TAG missing in .env}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      # cars and traffic over UDP (WebRTC, server/rtc.ts): the address browsers reach, and the ports announced, most wanted first
      PUBLIC_IP: 57.129.174.3
      PUBLIC_PORTS: 40000,5060,123
    ports: # straight to the container (Caddy only proxies HTTP); Docker's rules pass ufw. 5060 (SIP) and 123 (NTP) get out of strict networks
      - "40000:40000/udp"
      - "5060:40000/udp"
      - "123:40000/udp"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 5
    networks:
      proxy:
        aliases: [line-game]

networks:
  proxy:
    external: true
