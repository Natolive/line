# Every push and PR: typecheck, tests, production build and image.
# Push to main: image published to GHCR (ghcr.io/natolive/line:<sha>), then, if everything is green, deployed
# (an SSH key that can only run /srv/line/deploy.sh <sha>) and the live site checked from the outside.
# Actions pinned to their commit (public repo: a tag can be moved).
name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', '.claude/**']
  pull_request:
    paths-ignore: ['**.md', '.claude/**']

# A new push to a PR cancels the running one; on main, every commit goes all the way.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Same version as the Dockerfile image.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  # On a PR: built without being published (a broken build shows before the merge).
  image:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - if: env.PUBLISH == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: prod
          push: ${{ env.PUBLISH == 'true' }}
          tags: ghcr.io/natolive/line:${{ github.sha }}
          # Links the image to the repo (same visibility, listed under "Packages").
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          # No attestation: one version per commit in GHCR, which keeps clean-up simple.
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Keeps the last 10 images (versions you can roll back to), deletes older ones.
      - if: env.PUBLISH == 'true'
        uses: actions/delete-package-versions@e5bc658cc4c965c472efe991f8beea3981499c55 # v5.0.0
        with:
          package-name: line
          package-type: container
          min-versions-to-keep: 10

  deploy:
    needs: [test, image]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    concurrency: deploy
    environment:
      name: production
      url: https://line.natolive.fr
    steps:
      - name: Deploy to the server
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy nathan@57.129.174.3 ${{ github.sha }}
      # From the outside: DNS, certificate, Caddy, then the game server behind it.
      - name: Check the site
        run: curl -fsS --retry 5 --retry-delay 3 --retry-all-errors https://line.natolive.fr/health
